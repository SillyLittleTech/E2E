name: 'E2E Testing Suite'
description: 'Capture multi-viewport screenshots, test light/dark modes, run unit tests, and check a11y with Playwright dynamically.'
author: 'SillyLittleTech'

branding:
  icon: 'camera'
  color: 'purple'

inputs:
  port:
    description: 'Port for the preview server and Playwright tests'
    required: false
    default: '4173'
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'
  build-command:
    description: 'Command to build the site'
    required: false
    default: 'npm run build'
  preview-command:
    description: 'Command to start the preview server'
    required: false
    default: 'npm run preview'
  config-file:
    description: 'Path to E2E configuration JSON file'
    required: false
    default: 'e2e-config.json'

runs:
  using: 'composite'
  steps:
    - name: Use Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install deps
      shell: bash
      run: npm ci

    - name: Run pre-run script (Unit tests)
      shell: bash
      run: node ${{ github.action_path }}/scripts/pre-run.js ${{ inputs.config-file }} ${{ github.action_path }}/scripts/default-config.json

    - name: Build site
      shell: bash
      run: ${{ inputs.build-command }}

    - name: Start preview server
      shell: bash
      run: ${{ inputs.preview-command }} -- --port ${{ inputs.port }} &

    - name: Wait for server to be ready
      shell: bash
      run: npx wait-on http://localhost:${{ inputs.port }}

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps

    - name: Copy dynamic spec file to workspace
      shell: bash
      run: |
        mkdir -p playwright-logs
        cp ${{ github.action_path }}/scripts/e2e-dynamic.spec.ts ./e2e-dynamic.spec.ts

    - name: Run Playwright tests
      shell: bash
      env:
        E2E_CONFIG_PATH: ${{ inputs.config-file }}
        DEFAULT_CONFIG_PATH: ${{ github.action_path }}/scripts/default-config.json
      run: |
        npx playwright test ./e2e-dynamic.spec.ts

    - name: Generate Markdown Report
      shell: bash
      env:
        E2E_CONFIG_PATH: ${{ inputs.config-file }}
        DEFAULT_CONFIG_PATH: ${{ github.action_path }}/scripts/default-config.json
      run: node ${{ github.action_path }}/scripts/generate-summary.js

    - name: Add screenshot to job summary
      shell: bash
      run: |
        if [ -f "e2e-summary.md" ]; then
          cat e2e-summary.md >> "$GITHUB_STEP_SUMMARY"
        else
          echo "⚠️ E2E Summary not found." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-results
        path: |
          playwright-logs/**
          playwright-report/**
          axe-report.json
          e2e-summary.md
